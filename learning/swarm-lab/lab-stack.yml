# Example stack to deploy inside the lab cluster once it's up.
# Copy this file into the manager node (see README.md) and run:
#   docker stack deploy -c lab-stack.yml labstack
version: "3.8"

services:
  web:
    image: nginxdemos/hello
    ports:
      - "8888:80"
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
