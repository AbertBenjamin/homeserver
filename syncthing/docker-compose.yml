# Syncthing: knutepunkt for REAPER-prosjektene mellom desktopen og Macen.
# Serveren er alltid på, så de to maskinene trenger aldri å være på samtidig.
#
# Data ligger under /mnt/storage, og er dermed også synlig i SMB-sharet.
# Sync-porten (22000) og web-grensesnittet (8384) publiseres på verten, slik
# at begge nås på 192.168.1.39 fra hjemmenettet og via WireGuard.
# Grensesnittet har ikke passord: serveren er bare tilgjengelig lokalt og over VPN.
services:
  syncthing:
    container_name: syncthing
    image: syncthing/syncthing:2.1.7
    cpuset: "8-15"
    hostname: homeserver
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Oslo
    ports:
      - "22000:22000/tcp"
      - "22000:22000/udp"
      - "8384:8384"
    volumes:
      - /opt/homeserver/syncthing:/var/syncthing/config
      - /mnt/storage/reaper:/var/syncthing/reaper
    networks:
      net-files:
        ipv4_address: 172.22.0.7
    restart: unless-stopped

networks:
  net-files:
    external: true
