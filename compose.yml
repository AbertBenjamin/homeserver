include:
  - ./enshrouded/docker-compose.yml
  - ./nginx/docker-compose.yml
  - ./terraria/docker-compose.yml
  - ./fileshare/docker-compose.yml
  - ./runescape-dragonwilds/docker-compose.yml
  - ./mediaserver/docker-compose.yml

services:
  pihole:
    profiles: ["core"]
    container_name: pihole
    image: pihole/pihole:2026.07.2
    cpuset: "4-15"
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8080:80/tcp"
    volumes:
      # Without these, every container recreation (e.g. changing an env var
      # here) wipes gravity.db/config and forces a from-scratch gravity
      # rebuild. That rebuild also deadlocks (see `dns:` below), so this
      # caused a full DNS outage the first time the container had to be
      # recreated after initial setup.
      #
      # NOTE: must live under ~ (like enshrouded/terraria/nginx below), not
      # a path inside this repo checkout — the deploy workflow runs
      # `actions/checkout` with `clean: true`, which wipes any path inside
      # the repo on every single deploy.
      - ~/pihole/etc-pihole:/etc/pihole
      - ~/pihole/etc-dnsmasq.d:/etc/dnsmasq.d
    dns:
      # The host's own /etc/resolv.conf points at this same Pi-hole
      # (192.168.1.39). Docker's embedded resolver (127.0.0.11) forwards
      # container lookups to the host's resolv.conf by default, so on a
      # fresh gravity build the container ends up querying itself before
      # it's listening -> deadlock ("DNS resolution is currently
      # unavailable", loops forever). Point the container's own resolver
      # straight at public DNS so gravity/update checks can never depend
      # on Pi-hole being up yet.
      - 1.1.1.1
      - 8.8.8.8
    environment:
      TZ: "Europe/Oslo"
      WEBPASSWORD: ${PIHOLE_PASSWORD}
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD}
      FTLCONF_dns_listeningMode: "all"
      FTLCONF_dns_hosts: "192.168.1.39 debian;192.168.1.39 abert.homelinuxserver.org;192.168.1.39 debian.lan"
      # Default (1000/60s) gets tripped by Steam's steamcontent.com CDN
      # cache-server discovery, which fires bursts of tens of thousands of
      # DNS queries/min. That trips FTL's per-client rate limit, which then
      # blocks ALL DNS for that client for the rest of the window (looks
      # like "the internet is down"). Raised to give legitimate bursty
      # clients headroom while still catching real floods/DGA-style abuse.
      FTLCONF_dns_rateLimit_count: "15000"
      FTLCONF_dns_rateLimit_interval: "60"
    cap_add:
      - NET_ADMIN
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      net-core:
        ipv4_address: 172.20.0.5
    restart: unless-stopped

  wireguard:
    profiles: ["core"]
    container_name: wireguard
    image: linuxserver/wireguard:1.0.20260223
    cpuset: "4-15"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Oslo
      - SERVERURL=${SERVER_URL}
      - SERVERPORT=51820
      - PEERS=10
      - PEERDNS=172.20.0.5
      - INTERNAL_SUBNET=10.13.13.0
      - ALLOWEDIPS=0.0.0.0/0
    volumes:
      - ~/wireguard/config:/config
      - /lib/modules:/lib/modules:ro
    ports:
      - "51820:51820/udp"
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    networks:
      net-core:
        ipv4_address: 172.20.0.3
      net-media:
      net-files:
      net-games:

    restart: unless-stopped

networks:
  net-core:
    name: net-core
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
  net-media:
    name: net-media
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/24
  net-files:
    name: net-files
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/24
  net-games:
    name: net-games
    driver: bridge
    ipam:
      config:
        - subnet: 172.23.0.0/24
