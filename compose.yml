include:
  - ./enshrouded/docker-compose.yml
  - ./nginx/docker-compose.yml
  - ./terraria/docker-compose.yml
  - ./fileshare/docker-compose.yml
  - ./runescape-dragonwilds/docker-compose.yml
  - ./mediaserver/docker-compose.yml

services:
  pihole:
    profiles: ["core"]
    container_name: pihole
    image: pihole/pihole:2026.07.2
    cpuset: "4-15"
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8080:80/tcp"
    environment:
      TZ: "Europe/Oslo"
      WEBPASSWORD: ${PIHOLE_PASSWORD}
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD}
      FTLCONF_dns_listeningMode: "all"
      FTLCONF_dns_hosts: "192.168.1.39 debian"
    cap_add:
      - NET_ADMIN
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      net-core:
        ipv4_address: 172.20.0.5
    restart: unless-stopped

  wireguard:
    profiles: ["core"]
    container_name: wireguard
    image: linuxserver/wireguard:1.0.20260223
    cpuset: "4-15"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Oslo
      - SERVERURL=${SERVER_URL}
      - SERVERPORT=51820
      - PEERS=10
      - PEERDNS=172.20.0.5
      - INTERNAL_SUBNET=10.13.13.0
      - ALLOWEDIPS=0.0.0.0/0
    volumes:
      - ~/wireguard/config:/config
      - /lib/modules:/lib/modules:ro
    ports:
      - "51820:51820/udp"
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    networks:
      net-core:
        ipv4_address: 172.20.0.3
      net-media:
      net-files:
      net-games:

    restart: unless-stopped

networks:
  net-core:
    name: net-core
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
  net-media:
    name: net-media
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/24
  net-files:
    name: net-files
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/24
  net-games:
    name: net-games
    driver: bridge
    ipam:
      config:
        - subnet: 172.23.0.0/24
