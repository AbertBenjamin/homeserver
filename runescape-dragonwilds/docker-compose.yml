services:
  runescape-dragonwilds:
    profiles: ["games"]
    image: indifferentbroccoli/runescape-dragonwilds-server-docker:v1.0.3
    container_name: runescape-dragonwilds
    cpuset: "8-15"
    stop_grace_period: 30s
    dns:
      - 1.1.1.1
    ports:
      - "7788:7788/udp"
      - "8888:8888/udp"
    volumes:
      - /home/benjamin/runescape-dragonwilds:/home/steam/server-files
    labels:
      cd.doco.deployment.autostart: "false"
    environment:
      - OWNER_ID=${OWNER_ID}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SERVER_NAME=DragonWildsServer
      - DEFAULT_WORLD_NAME=world
      - WORLD_PASSWORD=${WORLD_PASSWORD}
      - DEFAULT_PORT=7788
      - MAX_PLAYERS=10
      - UPDATE_ON_START=true
      - PUID=1000
      - PGID=1000
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
        reservations:
          cpus: "1.0"
          memory: 2G
    networks:
      net-games:
        ipv4_address: 172.23.0.11
    restart: unless-stopped

networks:
  net-games:
    external: true
