name: Deploy to server

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: [self-hosted, debian]
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true

      - name: Decrypt secret
        run: sops -d -i .env

      - name: Decrypt secret
        working-directory: ./enshrouded
        run: sops -d -i .env

      - name: Decrypt secret
        working-directory: ./fileshare
        run: sops -d -i .env

      - name: Decrypt secret
        working-directory: ./mediaserver
        run: sops -d -i .env

      - name: Decrypt secret
        working-directory: ./runescape-dragonwilds
        run: sops -d -i .env

      - name: Deploy
        env:
          COMPOSE_PROFILES: core,games,https,mediaserver
        run: |
          docker compose up -d --pull always --remove-orphans
          docker image prune -f

