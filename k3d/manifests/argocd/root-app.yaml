# App-of-apps: applyes én gang av CI-workflowen, overvåker deretter k3d/apps/
# selv. Nye undermapper der blir automatisk nye ArgoCD Applications.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/AbertBenjamin/homeserver
    targetRevision: main
    path: k3d/apps
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
