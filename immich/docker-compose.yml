
services:
  immich-server:
    container_name: immich-server
    image: ghcr.io/immich-app/immich-server:v3.3.5
    cpuset: "8-15"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      DB_HOSTNAME: immich-postgres
      DB_USERNAME: immich
      DB_DATABASE_NAME: immich
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOSTNAME: immich-redis
      TZ: Europe/Oslo
    ports:
      - "2283:2283"
    volumes:
      - /mnt/storage/immich:/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      # Fast IP på net-files, som wireguard-containeren også er koblet til,
      # så VPN-klientene når den direkte uten å gå via LAN-IP-en.
      net-files:
        ipv4_address: 172.22.0.8
      # db/redis ligger bare her
      default: {}
    depends_on:
      - immich-redis
      - immich-postgres
    deploy:
      resources:
        limits:
          memory: 4G
    restart: unless-stopped

  immich-machine-learning:
    container_name: immich-machine-learning
    image: ghcr.io/immich-app/immich-machine-learning:v3.3.5
    cpuset: "8-15"
    # Laster ned modeller fra huggingface.co; uten dette feiler DNS i
    # containeren (samme som i mediaserver/nginx).
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - /opt/homeserver/immich/model-cache:/cache
    # Ansiktsgjenkjenning/CLIP ved første import tar all CPU den får; taket
    # hindrer at det kveler jellyfin og spillserverne på de samme kjernene.
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G
    restart: unless-stopped

  immich-redis:
    container_name: immich-redis
    image: docker.io/valkey/valkey:9@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7
    cpuset: "8-15"
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    restart: unless-stopped

  immich-postgres:
    container_name: immich-postgres
    image: ghcr.io/immich-app/postgres:16-vectorchord0.4.3-pgvectors0.2.0@sha256:1a078b237c1d9b420b0ee59147386b4aa60d3a07a8e6a402fc84a57e41b043a4
    cpuset: "8-15"
    environment:
      POSTGRES_USER: immich
      POSTGRES_DB: immich
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - /opt/homeserver/immich/postgres:/var/lib/postgresql/data
    shm_size: 128mb
    restart: unless-stopped

networks:
  net-files:
    external: true

