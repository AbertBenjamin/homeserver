# Immich: bildebackup fra mobilene. Kun LAN og WireGuard foreløpig — ingen
# nginx-rute, så den nås på http://192.168.1.39:2283 (hjemmefra via VPN).
#
# Bildene ligger på storage-disken, Postgres på systemdisken (/opt): Immich
# advarer mot databasen på treg disk. server og machine-learning må ha samme
# tag. Postgres-imaget er Immichs eget (vectorchord), ikke vanlig postgres.
services:
  immich-server:
    container_name: immich-server
    image: ghcr.io/immich-app/immich-server:v3.3.5
    cpuset: "8-15"
    environment:
      DB_HOSTNAME: immich-postgres
      DB_USERNAME: immich
      DB_DATABASE_NAME: immich
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOSTNAME: immich-redis
      TZ: Europe/Oslo
    ports:
      - "2283:2283"
    volumes:
      - /mnt/storage/immich:/data
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - immich-redis
      - immich-postgres
    deploy:
      resources:
        limits:
          memory: 4G
    restart: unless-stopped

  immich-machine-learning:
    container_name: immich-machine-learning
    image: ghcr.io/immich-app/immich-machine-learning:v3.3.5
    cpuset: "8-15"
    volumes:
      - /opt/homeserver/immich/model-cache:/cache
    # Ansiktsgjenkjenning/CLIP ved første import tar all CPU den får; taket
    # hindrer at det kveler jellyfin og spillserverne på de samme kjernene.
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G
    restart: unless-stopped

  immich-redis:
    container_name: immich-redis
    image: docker.io/valkey/valkey:9@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7
    cpuset: "8-15"
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    restart: unless-stopped

  immich-postgres:
    container_name: immich-postgres
    image: ghcr.io/immich-app/postgres:16-vectorchord0.4.3-pgvectors0.2.0@sha256:1a078b237c1d9b420b0ee59147386b4aa60d3a07a8e6a402fc84a57e41b043a4
    cpuset: "8-15"
    environment:
      POSTGRES_USER: immich
      POSTGRES_DB: immich
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - /opt/homeserver/immich/postgres:/var/lib/postgresql/data
    shm_size: 128mb
    restart: unless-stopped

# Ingen delte nettverk: db/redis ligger på stackens eget default-nettverk, og
# server nås via porten på hosten (også fra WireGuard-klientene).
