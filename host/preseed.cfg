# Debian 13 (trixie) preseed for den fysiske homeserveren — lag 1a.
# Holder seg med vilje minimal: OS + SSH-tilgang. Alt annet eies av bootstrap.sh.
# Bruk: se host/README.md.

# Lokalisering
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select no

# Nett: DHCP — ruteren holder fast IP via reservasjon (192.168.2.39)
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string homeserver
d-i netcfg/get_domain string unassigned-domain

# Pakkespeil
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# Klokke
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Oslo
d-i clock-setup/ntp boolean true

# Bruker: root deaktivert; debian med LÅST passord — innlogging kun via
# SSH-nøkkel (legges inn i late_command), sudo uten passord.
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Debian
d-i passwd/username string debian
d-i passwd/user-password-crypted password *
d-i user-setup/allow-password-weak boolean true

# Disk: hele første disk, én partisjon, ext4.
# Har maskinen flere disker: pek eksplisitt, f.eks.
#   d-i partman-auto/disk string /dev/nvme0n1
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# Pakker: kun det som trengs for at bootstrap.sh/Ansible skal nå maskinen
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string sudo python3 curl git ca-certificates
d-i pkgsel/upgrade select safe-upgrade
popularity-contest popularity-contest/participate boolean false

# Grub på installasjonsdisken
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

# Førsteboot-tilgang: SSH-nøkkel + passordløs sudo (samme mønster som
# cloud-init-templaten i terraform/ bruker for VM-ene)
d-i preseed/late_command string \
    in-target mkdir -p /home/debian/.ssh ; \
    in-target sh -c "echo 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEE7zqr/qlkP1UvFYomfnSmyw+fhMOdV+hQwcsxmN8n5 debian@nixos-desktop' > /home/debian/.ssh/authorized_keys" ; \
    in-target chown -R debian:debian /home/debian/.ssh ; \
    in-target chmod 700 /home/debian/.ssh ; \
    in-target chmod 600 /home/debian/.ssh/authorized_keys ; \
    in-target sh -c "echo 'debian ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/debian" ; \
    in-target chmod 440 /etc/sudoers.d/debian

d-i finish-install/reboot_in_progress note
