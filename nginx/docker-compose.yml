services:
  nginx:
    profiles: ["https"]
    image: nginx:1.31.6-alpine
    container_name: nginx
    cpuset: "8-15"
    dns:
      - "1.1.1.1"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/:/etc/nginx/conf.d:ro
      - /home/benjamin/nginx/certs/:/etc/nginx/certs:ro
      - ./html/:/usr/share/nginx/html:ro
      # ACME-challenges skrives av certbot. Må være en vertsmappe: under doco-cd
      # er repo-filene en egen kopi per commit.
      - /home/benjamin/nginx/acme:/var/www/acme:ro
      - /home/benjamin/logs:/var/log/nginx
    labels:
      # doco-cd: oppdater config/html på plass i stedet for å rekreere
      # containeren, og send SIGHUP så nginx laster inn på nytt. Er confen
      # ugyldig beholder nginx den gamle (som `nginx -t && nginx -s reload`).
      cd.doco.deployment.recreate.ignore: "{bindMounts: [/etc/nginx/conf.d, /usr/share/nginx/html]}"
      cd.doco.deployment.recreate.ignore.signal: "SIGHUP"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 64M
    restart: unless-stopped
    networks:
      proxy: {}
      net-media:
        ipv4_address: 172.21.0.19

  certbot:
    profiles: ["https"]
    image: certbot/certbot:v5.8.0
    container_name: certbot
    cpuset: "8-15"
    dns:
      - "1.1.1.1"
    volumes:
      - /home/benjamin/nginx/certs:/etc/letsencrypt
      # webroot_path i renewal-confene er /var/www/html, så målet beholdes
      - /home/benjamin/nginx/acme:/var/www/html
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done"
    networks:
      - proxy
    restart: unless-stopped

  fail2ban:
    profiles: ["https"]
    image: crazymax/fail2ban:1.1.1
    container_name: fail2ban
    cpuset: "8-15"
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - TZ=Europe/Oslo
      - F2B_LOG_TARGET=STDOUT
      - F2B_LOG_LEVEL=INFO
      - F2B_DB_PURGE_AGE=30d
      - IPTABLES_MODE=auto
    volumes:
      - /opt/homeserver/fail2ban:/data
      - ./fail2ban/jail.d:/data/jail.d:ro
      - ./fail2ban/filter.d:/data/filter.d:ro
      - /home/benjamin/logs:/var/log/nginx:ro

networks:
  proxy:
    external: true
  net-media:
    external: true
