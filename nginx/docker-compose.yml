services:
  nginx:
    profiles: ["https"]
    image: nginx:1.31.4-alpine
    container_name: nginx
    cpuset: "4-15"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/:/etc/nginx/conf.d:ro
      - ~/nginx/certs/:/etc/nginx/certs:ro
      - ./html/:/usr/share/nginx/html:ro
      - ~/logs:/var/log/nginx
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 64M
    restart: unless-stopped
    networks:
      proxy: {}
      net-media:
        ipv4_address: 172.21.0.19

  certbot:
    profiles: ["https"]
    image: certbot/certbot
    container_name: certbot
    cpuset: "4-15"
    volumes:
      - ~/nginx/certs:/etc/letsencrypt
      - ./html/:/var/www/html
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done"
    networks:
      - proxy
    restart: unless-stopped

  fail2ban:
    profiles: ["https"]
    image: crazymax/fail2ban:1.1.0
    container_name: fail2ban
    cpuset: "4-15"
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - TZ=Europe/Oslo
      - F2B_LOG_TARGET=STDOUT
      - F2B_LOG_LEVEL=INFO
      - F2B_DB_PURGE_AGE=30d
      - IPTABLES_MODE=auto
    volumes:
      - /opt/homeserver/fail2ban:/data
      - ./fail2ban/jail.d:/data/jail.d:ro
      - ./fail2ban/filter.d:/data/filter.d:ro
      - ~/logs:/var/log/nginx:ro

networks:
  proxy:
    name: proxy
    driver: bridge
    ipam:
      config:
        - subnet: 172.24.0.0/24
