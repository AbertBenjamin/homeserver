services:
  samba:
    container_name: samba
    image: dockurr/samba:4.23.5
    environment:
      USER: "${fileshare_username}"
      PASS: "${fileshare_password}"
    ports:
      - "445:445"
    volumes:
      - /mnt/storage:/storage
    networks:
      net-files:
        ipv4_address: 172.22.0.6
    restart: unless-stopped
