# yaml-language-server: $schema=https://doco.cd/v0.129/schemas/deploy.schema.json
# Deploy-konfig for doco-cd (se doco-cd/docker-compose.yml). doco-cd poller
# main og dekrypterer sops-krypterte .env-filer i sin egen kopi av repoet.
#
# Én stack per mappe: feiler en deploy, tvangs-rekreerer doco-cd ALLE
# tjenestene i den stacken ved neste forsøk — så en ødelagt spillserver skal
# ikke kunne ta ned pihole/nginx/media.
#
# Felles for alle: timeout over default 3m pga. store image-pull og lange
# stop_grace_period; retry med pause så en feilende stack ikke rekreeres
# hvert minutt. Ingen force_image_pull: da sjekker doco-cd registryet ved
# hver poll og rekreerer tjenester når en tag bygges på nytt (linuxserver
# gjør det ofte). Nye versjoner kommer i stedet via dependabot.

name: core
working_dir: core
profiles: [core]
timeout: 20m
retry: {limit: 2, delay: 10m}
---
name: nginx
working_dir: nginx
profiles: [https]
timeout: 20m
retry: {limit: 2, delay: 10m}
